# === 侠客行 (探索型副本) ===
[[dungeons]]
id = "xiake_island"
title = "侠客行"
summary = "江湖上突然出现了一张神秘的请柬，邀请天下高手前往南海侠客岛。据说岛上有失传已久的绝世武功——'太玄经'。"
life_stages = ["adult", "middle_age"]
rarity = 1
min_wits = 7
once_per_game = true

[[dungeons.stages]]
id = "sailing"
title = "[副本] 扬帆出海"
description = "你带着请柬来到了约定的港口。来接你的是一艘没有船夫的小舟，船上只有一行字：'有缘者自可到'。"

[[dungeons.stages.choices]]
text = "乘舟出海，任其漂流"
outcome_text = "你跳上了小舟。海上的风暴和迷雾没有阻挡住你，三天后你看到了那座传说中的岛。"
qi = 1
wits = 1

[[dungeons.stages.choices]]
text = "自己驾船前往"
outcome_text = "你雇了一艘船自己驾往请柬上标注的坐标。虽然辛苦但你掌握了主动权。"
agility = 1
wits = 1

[[dungeons.stages]]
id = "island"
title = "[副本] 侠客岛上"
description = "岛上已有数十位武林高手在此。一面高耸的石壁上刻满了蝌蚪文和奇怪的图形——这就是传说中的'太玄经'。每个人都在疯狂地解读这些刻文。"

[[dungeons.stages.choices]]
text = "潜心观摩石壁，尝试解读"
outcome_text = "你发现这些刻文不是用眼睛看的，而是用心去感受的。你闭上眼睛，石壁上的武功仿佛直接流入了你的脑海。"
