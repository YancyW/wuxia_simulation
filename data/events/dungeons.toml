technique = 3
wits = 2
bone = 1

[[dungeons.stages.choices]]
text = "将领悟记录下来，传于后世"
outcome_text = "你将这三天来的感悟写成了一本书。这本书后来成为了武林中的又一部经典。"
wits = 4
reputation = 2
qi = 1

[[dungeons.stages]]
id = "return"
title = "[副本] 归来"
description = "侠客岛开始沉没了。所有幸存者争先恐后地登船离开。在最后一刻，你回头看了一眼那个改变了一切的地方。"

[[dungeons.stages.choices]]
text = "不带遗憾地离开"
outcome_text = "你心满意足地离开了侠客岛。你已经得到了你想要的——不只是一套武功，而是武学的真谛。"
