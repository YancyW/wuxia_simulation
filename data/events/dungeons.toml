[[dungeons]]
id = "ancient_tomb"
title = "古墓探秘"
summary = "你在深山中偶然发现了一座古代武学宗师的地下陵墓，其中或许藏着失传的武功秘籍。"
life_stages = ["young_adult", "adult"]
rarity = 1
min_bone = 5
once_per_game = true

[[dungeons.stages]]
id = "entrance"
title = "[副本] 古墓入口"
description = "你拨开茂密的藤蔓，一扇沉重的石门出现在眼前。门上刻着古老的文字和复杂的机关，似乎需要特殊的方法才能打开。"

[[dungeons.stages.choices]]
text = "研究机关，破解谜题"
outcome_text = "你凭借过人的悟性解开了机关。石门缓缓打开，一股陈腐的气息扑面而来。"
wits = 2

[[dungeons.stages.choices]]
text = "绕到后山寻找其他入口"
outcome_text = "你从悬崖一侧攀爬而上，发现了一个通风口，虽然危险但成功进入了陵墓内部。"
agility = 2
constitution = -1

[[dungeons.stages.choices]]
text = "用蛮力推开石门"
outcome_text = "你运足内力，硬生生将石门推开。虽然费了不少力气，但总算进去了。"
qi = 1
bone = 1

[[dungeons.stages]]
id = "main_hall"
title = "[副本] 古墓正厅"
description = "正厅中央立着一尊青铜武像，四周壁画描绘着高深的武学招式。一个石台上放着一本泛黄的古籍，但石台周围似乎有暗器机关。"

[[dungeons.stages.choices]]
text = "按照壁画演练招式，以示诚意"
outcome_text = "你按照壁画上的招式演练了一番，机关竟然自动解除了。原来这是墓主人对后人的考验。"
technique = 2
wits = 1

[[dungeons.stages.choices]]
text = "用轻功避开机关夺取古籍"
outcome_text = "你施展轻功，在暗器雨中穿梭，成功拿到了古籍，但手臂上还是中了一支毒箭。"
agility = 2
constitution = -2
qi = 1

[[dungeons.stages.choices]]
text = "仔细寻找解除机关的开关"
outcome_text = "你观察了半个时辰，终于在一处不起眼的角落找到了机关总闸，安全地拿到了古籍。"
wits = 3

[[dungeons.stages]]
id = "inner_chamber"
title = "[副本] 密室传承"
description = "古籍引导你来到了最深处的密室。这里放着墓主人的遗骨和一柄古剑，墙上刻着完整的武学心法。但同时你也感受到了一股凌厉的剑意残留。"

[[dungeons.stages.choices]]
text = "盘膝参悟墙上的心法"
outcome_text = "你沉浸在剑意之中，三天三夜后醒来，感觉自己的武学境界有了质的飞跃。"
qi = 3
technique = 3
wits = 1

[[dungeons.stages.choices]]
text = "取下古剑，以剑试法"
outcome_text = "你握住古剑的瞬间，一股磅礴的剑意涌入体内。古剑认你为主，剑法突飞猛进。"
technique = 4
bone = 1
learn_art = "dugu9jian"

[[dungeons.stages.choices]]
text = "磕头拜师，以示尊敬"
outcome_text = "你向墓主人行了拜师大礼。墓室中突然亮起柔和的光芒，你感到一股温暖的力量融入了你的经脉。"
bone = 2
qi = 2
honor = 2

[dungeons.reward]
bone = 1
qi = 1
technique = 1
set_flags = ["completed_ancient_tomb"]


[[dungeons]]
id = "martial_tournament"
title = "武林大会"
summary = "四年一度的武林大会即将在泰山之巅举行，天下英雄汇聚于此。这是扬名立万的绝佳机会！"
life_stages = ["adult"]
rarity = 1
