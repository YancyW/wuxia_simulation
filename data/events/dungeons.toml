[[dungeons.stages.choices]]
text = "报名个人赛，独自应战"
outcome_text = "你登记了个人赛。以你的实力，前几轮应该不成问题。"
technique = 1
reputation = 1

[[dungeons.stages.choices]]
text = "找几个朋友组队参加团体赛"
outcome_text = "你找到了几位志同道合的江湖朋友，组成了一支队伍参加团体赛。"
wits = 1
reputation = 1

[[dungeons.stages.choices]]
text = "先观战，最后再决定"
outcome_text = "你仔细观察了各派高手的实力，对自己的水平有了更清晰的认识。"
wits = 2

[[dungeons.stages]]
id = "preliminary"
title = "[副本] 初赛对决"
description = "你的对手是一位成名已久的剑客，剑法凌厉，在江湖上颇有威名。观众席上人声鼎沸。"

[[dungeons.stages.choices]]
text = "全力以赴，速战速决"
outcome_text = "你一上来就使出绝招，十招之内击败对手，观众席爆发出雷鸣般的欢呼。"
