description = "你带人杀入了魔教总坛。魔教高手倾巢而出，双方展开了一场惨烈的混战。一个魔教护法直取你的要害。"

[[dungeons.stages.choices]]
text = "正面迎战魔教护法"
outcome_text = "你和魔教护法对拼数百招，最终以刚猛内力将其击毙。但你也受了不轻的内伤。"
