[[dungeons.stages.choices]]
text = "婉拒一切邀请，潇洒离去"
outcome_text = "你对名位没有兴趣，领了奖赏便飘然而去。江湖上又多了一段传说。"
agility = 1
wits = 1
set_flags = ["retired"]

[dungeons.reward]
reputation = 3
technique = 1
set_flags = ["completed_tournament"]


[[dungeons]]
