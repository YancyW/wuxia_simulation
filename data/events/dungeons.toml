reputation = 2

[[dungeons.stages.choices]]
text = "保留实力，稳扎稳打"
outcome_text = "你以稳健的防守消耗对手体力，在第二十招时找准破绽一击制胜。"
wits = 2
technique = 1

[[dungeons.stages]]
id = "finals"
title = "[副本] 决赛争锋"
description = "你一路过关斩将，终于站到了决赛的擂台上。对手是上届冠军的得意弟子，实力深不可测。"

[[dungeons.stages.choices]]
text = "正面对决，以实力说话"
outcome_text = "你和对手大战三百回合，最终以一招险胜。全场起立为你鼓掌！"
technique = 3
reputation = 3
bone = 1
constitution = -2

[[dungeons.stages.choices]]
text = "智取，利用对手的破绽"
outcome_text = "你发现对手左肩有旧伤，巧妙地将战斗引向那个方向，最终以智取胜。"
wits = 3
technique = 1
reputation = 2

[[dungeons.stages.choices]]
text = "点到为止，主动握手言和"
outcome_text = "你和对手打成了平手，互相敬重。虽然没拿到冠军，但你赢得了比冠军更珍贵的尊重。"
honor = 3
reputation = 2
wits = 1

[[dungeons.stages]]
id = "glory"
title = "[副本] 名扬天下"
description = "武林大会落下帷幕，你的名字已经传遍天下。各派掌门纷纷前来道贺，有人邀请你出任要职。"

[[dungeons.stages.choices]]
text = "接受武林盟主的邀请，担任执事"
outcome_text = "你成为了武林盟的执事，拥有了在武林中举足轻重的地位。"
