[[dungeons.stages.choices]]
text = "观察岛上的其他人如何解读"
outcome_text = "你注意到每个人看到的'太玄经'似乎都不一样。这个发现让你对武学的本质有了全新的理解。"
wits = 3

[[dungeons.stages]]
id = "revelation"
title = "[副本] 大彻大悟"
description = "你终于明白了——太玄经不是一套固定的武功，而是一面镜子。它映照出每个人内心最深处的武学理解。"

[[dungeons.stages.choices]]
text = "将自己的领悟融入武功，当场突破"
outcome_text = "你盘膝坐在石壁前，三天后站起来时，全身经脉贯通，武功更上一层楼。"
