[[events]]
id = "youth_discover_talent"
title = "天赋初现"
description = "你在村中玩耍时，无意间展现了过人的武学天赋，一位路过的老拳师注意到了你。"
life_stages = ["youth"]
rarity = 5

[[events.choices]]
text = "虚心请教，跟老拳师学习基本功"
outcome_text = "老拳师教你扎马步、打基础，你学得有模有样。"
bone = 1
technique = 1

[[events.choices]]
text = "炫耀天赋，在村民面前表演"
outcome_text = "你赢得了村民的喝彩，但老拳师摇摇头走了。"
reputation = 1
wits = -1

[[events.choices]]
text = "不以为意，继续玩耍"
outcome_text = "你错过了这次机会，但快乐的童年也算一种收获。"
constitution = 1

[[events]]
id = "youth_family_teaching"
title = "家学渊源"
description = "你的家人开始教你识字读书，你展现出与众不同的领悟力。"
life_stages = ["youth"]
rarity = 5
min_wits = 4

[[events.choices]]
text = "刻苦攻读，博览群书"
outcome_text = "你打下了扎实的学问根基，对日后领悟高深武功大有裨益。"
wits = 2
qi = 1

[[events.choices]]
text = "只学皮毛，更喜欢舞刀弄枪"
outcome_text = "你粗通文墨，但把更多时间花在了拳脚上。"
bone = 1
technique = 1

[[events]]
id = "youth_bully"
title = "恶霸欺凌"
description = "村里的恶霸少年带人欺负你和同伴，你被堵在了巷子里。"
life_stages = ["youth"]
rarity = 4
min_wits = 4

[[events.choices]]
text = "挺身而出，和恶霸打一架"
outcome_text = "虽然鼻青脸肿，但你打出了骨气，恶霸之后再不敢惹你。"
bone = 1
constitution = 1
honor = 2

[[events.choices]]
text = "机智周旋，用言语化解冲突"
outcome_text = "你三言两语化解了危机，同伴们对你的机智佩服不已。"
wits = 1
reputation = 1

[[events.choices]]
text = "撒腿就跑，好汉不吃眼前亏"
outcome_text = "你跑得快，没吃亏，但同伴们对你有些失望。"
agility = 1
honor = -1

[[events]]
id = "youth_mysterious_old_man"
title = "神秘老人"
description = "一位衣衫褴褛的老人晕倒在路边，众人避之不及。你走近一看，发现他气息微弱但眼神锐利。"
life_stages = ["youth"]
rarity = 2
min_qi = 4

[[events.choices]]
text = "扶老人回家，悉心照料"
outcome_text = "老人康复后，悄悄传了你一套吐纳之法，飘然而去。"
qi = 3
honor = 3
set_flags = ["met_mysterious_elder"]

[[events.choices]]
text = "去叫大人来帮忙"
outcome_text = "大人来了后老人已经不见了，地上只留下一本残破的拳谱。"
technique = 1

[[events]]
id = "youth_martial_contest_kid"
title = "少年比武"
description = "邻村来了几个习武的少年，在村口摆下擂台，扬言要教训本村的孩子。"
life_stages = ["youth"]
rarity = 3
min_technique = 4

[[events.choices]]
text = "上擂台应战"
outcome_text = "你虽然输了，但打得顽强，赢得了对手的尊重。"
technique = 1
reputation = 1
constitution = 1

[[events.choices]]
text = "在场下观察，学习他们的招式"
outcome_text = "你记下了他们的几招几式，回去后偷偷练习。"
wits = 1
technique = 1

[[events.choices]]
text = "去请村里的大人来解决"
outcome_text = "大人们出面赶走了他们，但你觉得有些丢脸。"
reputation = -1

[[events]]
id = "youth_herb_gathering"
title = "采药奇遇"
description = "你上山采药时，发现了一处隐秘的山洞，里面似乎有人居住过的痕迹。"
life_stages = ["youth"]
rarity = 3
min_qi = 4

[[events.choices]]
text = "进去探索"
outcome_text = "你在洞里发现了一本残缺的内功心法和一些丹药，虽然不全但极为珍贵。"
qi = 2
wits = 1

[[events.choices]]
text = "记住位置，回去禀告长辈"
outcome_text = "长辈们前来查看，发现是某位前辈的闭关之所，分了你一些丹药。"
qi = 1
reputation = 1

[[events.choices]]
text = "太危险了，还是不进去为好"
outcome_text = "你安全地回家了，但心中一直惦记着那个山洞。"

[[events]]
id = "youth_hunt"
title = "山林狩猎"
description = "跟随村中猎户进山打猎，你在密林中遇到了一只受伤的野狼。"
life_stages = ["youth"]
rarity = 3
min_agility = 4

[[events.choices]]
text = "举起木棍与狼对峙"
outcome_text = "你的勇气镇住了野狼，它最终退却了。猎户们对你刮目相看。"
bone = 1
reputation = 1

[[events.choices]]
text = "绕路避开，安全第一"
outcome_text = "你学会了在山林中保护自己，猎户教了你一些追踪技巧。"
agility = 1
wits = 1

[[events.choices]]
text = "设陷阱捕获野狼"
outcome_text = "你巧妙地用陷阱抓住了野狼，猎户们都说你天生是块好料子。"
wits = 1
technique = 1

[[events]]
id = "youth_traveling_merchant"
title = "行商路过"
description = "一支商队路过村庄，带来了远方的奇珍异宝和江湖故事。"
life_stages = ["youth"]
rarity = 3

[[events.choices]]
text = "听商人们讲江湖故事"
outcome_text = "江湖的精彩让你心驰神往，你暗暗立下了闯荡江湖的志向。"
reputation = 1
wits = 1

[[events.choices]]
text = "帮商队搬运货物赚点零钱"
outcome_text = "你用劳动换了些银两，还从商队护卫那里学了防身技巧。"
constitution = 1
technique = 1

[[events]]
id = "youth_flood"
title = "洪水来袭"
description = "连日大雨导致山洪暴发，村庄面临被淹的危险。"
life_stages = ["youth"]
rarity = 2
min_constitution = 3

[[events.choices]]
text = "奋不顾身帮助村民转移"
outcome_text = "你冒着危险救出了被困的老人和孩子，成了村里的小英雄。"
honor = 3
reputation = 2
constitution = 1

[[events.choices]]
text = "组织大家有序撤离"
outcome_text = "你冷静指挥，帮助村民安全转移到了高地。"
wits = 2
reputation = 1
honor = 1

[[events.choices]]
text = "先保护好自己和家人"
outcome_text = "你带着家人安全撤离，虽然没帮上别人但至少家人平安。"
agility = 1

[[events]]
id = "youth_sect_disciple"
title = "门派招收"
description = "附近门派的长老来村里招收新弟子，许多孩子都跃跃欲试。"
life_stages = ["youth"]
rarity = 3
min_bone = 5

[[events.choices]]
text = "参加入门测试"
outcome_text = "你的资质得到了认可，被门派长老收入门下。"
bone = 1
technique = 1
set_flags = ["sect_trial_passed"]

[[events.choices]]
text = "留在村里继续修炼基础"
outcome_text = "你觉得基础还不够扎实，决定再苦练一年。"
bone = 1
wits = 1

[[events]]
id = "youth_illness"
title = "大病一场"
description = "你突然发了一场高烧，卧床不起，家人急得团团转。"
life_stages = ["youth"]
rarity = 2
min_constitution = 4

[[events.choices]]
text = "靠意志力扛过去"
outcome_text = "你以顽强的意志战胜了病魔，痊愈后反而觉得身体更加坚韧了。"
constitution = 2
bone = 1

[[events.choices]]
text = "请郎中精心调养"
outcome_text = "在家人的悉心照料下你慢慢康复了，但也落下了些病根。"
constitution = -1
wits = 1

[[events]]
id = "youth_secret_manual"
title = "崖壁遗刻"
description = "你在后山悬崖下玩耍时，发现石壁上刻着一些奇怪的图案和小字。仔细一看，似乎是一套武功心法。"
life_stages = ["youth"]
rarity = 1
min_wits = 6

[[events.choices]]
text = "用心记忆，每天来此参悟"
outcome_text = "三年寒暑，你终于参透了崖壁上的武功，这是一套失传已久的入门心法。"
qi = 3
technique = 2
wits = 1

[[events.choices]]
text = "拓印下来带回去研究"
outcome_text = "你请村里的老先生帮忙辨认文字，一起研究其中奥秘。"
qi = 1
wits = 2

# --- Follow-up: 神秘老人再现 (triggers in young_adult via required_flags) ---
[[events]]
id = "youth_elder_promise"
title = "老人的承诺"
description = "当初那位神秘老人临走前对你说了句奇怪的话：'等你长大后，来西域天山找我。'"
life_stages = ["youth"]
rarity = 3
required_flags = ["met_mysterious_elder"]
once_per_game = true

[[events.choices]]
text = "将承诺铭记于心"
outcome_text = "你暗暗发誓，总有一天要去天山找那位老人。"
wits = 1
set_flags = ["promised_to_elder"]

[[events.choices]]
text = "觉得太遥远了，先做好眼前的事"
outcome_text = "你把心思放在当下。远处的际遇，以后再说。"
bone = 1

# --- NEW: 门派冲突波及 ---
[[events]]
id = "youth_sect_conflict"
title = "路过的大战"
description = "你在村外玩耍时，两个武林高手从天而降，在田野间激烈交手。剑气纵横，草木摧折。"
life_stages = ["youth"]
rarity = 2
min_technique = 4

[[events.choices]]
text = "躲在远处偷偷观察"
outcome_text = "你目睹了一场惊心动魄的高手对决，虽然看不懂太多，但对武学产生了深深的向往。"
wits = 1
technique = 1

[[events.choices]]
text = "等他们打完后上前询问"
outcome_text = "一位高手看你胆识不错，临走前随手扔给你一本入门的拳谱。"
bone = 1
technique = 1
reputation = 1

# --- NEW: 救助伤者 ---
[[events]]
id = "youth_save_wounded"
title = "林中伤者"
description = "你在山林中发现一个浑身是血的中年人靠在树下。他手中紧握着一块令牌，上面刻着'明教'二字。"
life_stages = ["youth"]
rarity = 2
min_constitution = 4

[[events.choices]]
text = "偷偷帮他包扎伤口"
outcome_text = "中年人醒来后感激不尽，低声对你说：'好孩子，日后若有难，来光明顶找我。'"
honor = 1
set_flags = ["helped_mingjiao"]

[[events.choices]]
text = "赶紧跑回去叫大人来"
outcome_text = "村里的大人们赶来时人已经不见了，只留下一滩血迹。"
agility = 1

# --- NEW: 小门派拜访 ---
[[events]]
id = "youth_small_sect_visit"
title = "门派来访"
description = "一个名不见经传的小门派掌门带着弟子来村里收徒。虽然没有大门派的气派，但掌门人看起来很和善。"
life_stages = ["youth"]
rarity = 3
min_reputation = 5

[[events.choices]]
text = "跟着这个小门派学些基础"
outcome_text = "虽然这个小门派没什么名气，但掌门的教导却格外用心。你打下了坚实的武学基础。"
bone = 1
technique = 2

[[events.choices]]
text = "婉拒了他们，想等更好的机会"
outcome_text = "你礼貌地拒绝了。掌门并不生气，只说了句'缘分未到'便离去了。"
wits = 1

[[events]]
id = "youth_batch_0"
title = "雨夜来客"
description = "一个风雨交加的夜晚，一个浑身湿透的陌生人敲响了你家的门。他看起来走了很远的路。"
life_stages = ["youth"]
rarity = 2
min_constitution = 4

[[events.choices]]
text = "请他进屋避雨，给他热汤"
outcome_text = "陌生人感激不尽。临走时他摸了摸你的头，说了句好孩子日后必有出息。"
honor = 2

[[events.choices]]
text = "警惕地在门口询问来历"
outcome_text = "你聪明地问清了对方的来历才放他进门——原来他是邻村走散的猎人。"
wits = 1

[[events]]
id = "youth_batch_1"
title = "杂耍班"
description = "一个走江湖的杂耍班来到了村口。喷火、顶碗、胸口碎大石——精彩的表演让你看得如痴如醉。"
life_stages = ["youth"]
rarity = 3
min_constitution = 4

[[events.choices]]
text = "缠着杂耍班主想学一两手"
outcome_text = "班主被你的热情感动，教你了一套假把式——虽然是表演用的但也有几分功夫底子。"
agility = 1
wits = 1

[[events.choices]]
text = "看了一整天表演，心满意足"
outcome_text = "你享受了一个无忧无虑的快乐日子。这种单纯的快乐日后越来越少了。"
constitution = 1

[[events]]
id = "youth_batch_2"
title = "老乞丐的故事"
description = "村里来了个邋遢的老乞丐，但他讲的故事却精彩绝伦——从大漠孤烟到江南烟雨，从华山论剑到东海屠龙。"
life_stages = ["youth"]
rarity = 2
min_technique = 4

[[events.choices]]
text = "每天都去听故事"
outcome_text = "老乞丐讲的江湖故事在你心中种下了闯荡江湖的种子。多年后你才发现——那些故事八成是真的。"
wits = 1
reputation = 1

[[events.choices]]
text = "给他送饭送水"
outcome_text = "你每天给他送饭。老乞丐临走前传了你一套无用的口诀。多年后你才发现那是上乘内功的入门。"
qi = 2
honor = 1
set_flags = ["beggar_rhyme"]
