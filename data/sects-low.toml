[[sects]]
id = "wushan"
name = "巫山派"
description = "川东巫山一带的山寨势力，亦正亦邪。山势险恶官府也奈何不得。"
type = "unorthodox"
exclusive_arts = []
allies = ["wudu"]
enemies = ["qingcheng", "emei"]
